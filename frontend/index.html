<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Akash Setu – Real-time 3D satellite orbit visualization powered by SGP4 propagation and Two-Line Element data.">
    <title>Akash Setu | 3D Satellite Tracker</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Three.js r158 (stable, no ES module required) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- OrbitControls (matching r128) -->
    <script>
    // Inline OrbitControls compatible with Three.js r128
    // Source: Three.js examples/js/controls/OrbitControls.js
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Inline critical overrides */
        .search-box { position: relative; padding: 14px 14px 4px; }
        .filter-tabs { padding: 6px 14px 12px; }
        .side-panel > .section-label {
            font-size: 10px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; color: var(--text-muted);
            padding: 10px 14px 2px;
        }
        .panel-toggle-btn {
            position: fixed; top: 74px; z-index: 110;
            width: 34px; height: 34px;
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-secondary);
            cursor: pointer; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            transition: left 0.2s ease, background 0.2s;
        }
        .panel-toggle-btn:hover { background: rgba(79,140,255,0.2); color: var(--text-primary); }
        .panel-visible .panel-toggle-btn { left: 360px; }
        .panel-hidden  .panel-toggle-btn { left: 12px; }
        body.panel-visible .side-panel { transform: translateX(0); }
        body.panel-hidden  .side-panel { transform: translateX(-360px); }
        .side-panel { transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
    </style>
</head>
<body class="panel-visible">

<!-- Loading overlay -->
<div class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Initializing 3D Earth &amp; loading satellite data…</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:-10px;">
        Connecting to Flask API at localhost:5000
    </div>
</div>

<!-- 3D Canvas -->
<canvas id="globe-canvas"></canvas>

<!-- Top navigation bar -->
<header class="top-bar">
    <div class="logo">
        <div class="logo-icon">🛰</div>
        <span>Akash Setu</span>
    </div>

    <div class="stats-badge" id="stats-text">Loading satellites…</div>

    <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
        <div class="time-display">
            <div class="live-dot"></div>
            <span id="sim-time">–</span>
        </div>
        <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;">
            SGP4 propagated • 30s refresh
        </div>
    </div>
</header>

<!-- Panel toggle button -->
<button class="panel-toggle-btn" id="panel-toggle" title="Toggle satellite list" aria-label="Toggle satellite panel">
    ☰
</button>

<!-- Left side panel: satellite list -->
<aside class="side-panel" role="complementary" aria-label="Satellite list">

    <div class="section-label">Satellites</div>

    <!-- Search -->
    <div class="search-box">
        <span style="position:absolute;left:26px;top:25px;color:var(--text-muted);font-size:14px;pointer-events:none;">🔍</span>
        <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Search by name or NORAD ID…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search satellites"
        >
    </div>

    <!-- Source filter tabs -->
    <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="stations">Stations</button>
        <button class="filter-tab" data-filter="active_satellites">Active</button>
    </div>

    <!-- Scrollable list -->
    <div class="sat-list" id="sat-list" role="list" aria-label="Satellite entries">
        <div style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px;">
            Loading…
        </div>
    </div>
</aside>

<!-- Right detail panel (hidden until satellite selected) -->
<aside class="detail-panel hidden" id="detail-panel" role="complementary" aria-label="Satellite details">
    <!-- Populated by JS -->
</aside>

<script src="js/app.js"></script>

<script>
// Panel toggle wiring (needs DOM + JS loaded)
(function() {
    const btn = document.getElementById('panel-toggle');
    if (!btn) return;
    btn.addEventListener('click', function() {
        const isVisible = document.body.classList.contains('panel-visible');
        document.body.classList.toggle('panel-visible', !isVisible);
        document.body.classList.toggle('panel-hidden',   isVisible);
    });
})();
</script>

</body>
</html>
